name: Arkhe
options:
  bundleIdPrefix: im.arkhe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  IRCCore:
    path: IRCCore

targets:
  Arkhe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: IRCCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Arkhe
        NSLocalNetworkUsageDescription: "Arkhe necesita acceso a tu red local para conectarse a servidores IRC y bouncers (como soju) alojados en tu red."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.arkhe.client
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LFTD9T269J
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
