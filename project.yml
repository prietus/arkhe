name: Arkhe
options:
  bundleIdPrefix: im.arkhe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  IRCCore:
    path: IRCCore

targets:
  Arkhe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: IRCCore
      - target: ArkheNotificationService
    scheme:
      testTargets:
        - ArkheTests
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Arkhe
        # Without these, xcodegen writes literal 1.0/1 into the generated
        # Info.plist, which overrides MARKETING_VERSION at build time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "Arkhe necesita acceso a tu red local para conectarse a servidores IRC y bouncers (como soju) alojados en tu red."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.arkhe.client
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LFTD9T269J
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Remote push + shared Keychain. Needs the Push Notifications and App
        # Groups capabilities on App ID im.arkhe.client (see docs/push-notifications.md).
        CODE_SIGN_ENTITLEMENTS: Config/Arkhe.entitlements

  # Decrypts Web Push payloads (relayed via APNs) on-device and formats the
  # notification. See push-relay/ and docs/push-notifications.md.
  ArkheNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotificationService
      - path: Shared
    dependencies:
      - package: IRCCore
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Arkhe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.arkhe.client.NotificationService
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LFTD9T269J
        CODE_SIGN_ENTITLEMENTS: Config/NotificationService.entitlements

  # Session-level tests: drive IRCSession through a fake IRCTransport.
  ArkheTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ArkheTests
    dependencies:
      - target: Arkhe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.arkhe.client.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LFTD9T269J
