server {
    listen 127.0.0.1:9443 ssl;
    listen [::1]:9443 ssl;
    http2 on;
    server_name push.arkhe.priet.us;

    ssl_certificate     /etc/letsencrypt/live/push.arkhe.priet.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.arkhe.priet.us/privkey.pem;

    # Web Push deliveries carry one short IRC line; cap the body to keep abuse cheap.
    client_max_body_size 8k;

    # Privacy: the device token is in the request path. Do not persist it (nor the
    # sender soju's IP) — keep only errors.
    access_log off;
    error_log  /var/log/nginx/arkhe-push-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TTL, Urgency, Authorization (VAPID) and Content-Encoding pass through.
    }
}
