server {
    listen 127.0.0.1:9443 ssl;
    listen [::1]:9443 ssl;
    http2 on;
    server_name arkhe.priet.us;

    ssl_certificate     /etc/letsencrypt/live/arkhe.priet.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkhe.priet.us/privkey.pem;

    root /srv/sites/arkhe-site/public;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_vary on;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    access_log /var/log/nginx/arkhe-access.log;
    error_log  /var/log/nginx/arkhe-error.log;
}
