<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkhe — a native IRCv3 client for iPhone &amp; iPad</title>
<meta name="description" content="Arkhe is a fast, native IRCv3 client for iPhone and iPad with SASL, CertFP and full IRC bouncer support.">
<style>
  :root{
    --accent:#2f6bff; --accent-2:#2563eb;
    --bg:#ffffff; --panel:#f6f8fc; --text:#1f2937; --muted:#5b6472; --border:#e6eaf1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1117; --panel:#161a22; --text:#e6e8ee; --muted:#9aa3b2; --border:#232936; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 20px; text-align:center;
  }
  .wrap{max-width:640px; margin:0 auto; padding:88px 0 72px}
  .badge{
    width:96px;height:96px;border-radius:24px;margin:0 auto 26px;
    background:linear-gradient(160deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:54px;
    box-shadow:0 10px 30px rgba(47,107,255,.4);
  }
  h1{font-size:2.1rem; margin:0 0 .3rem; letter-spacing:-.03em}
  .tag{color:var(--muted); font-size:1.1rem; margin:0 0 34px}
  .links{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .links a{
    display:inline-block; padding:11px 20px; border-radius:11px; font-weight:600;
    border:1px solid var(--border); color:var(--text); text-decoration:none;
    background:var(--panel);
  }
  .links a.primary{background:linear-gradient(160deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent}
  .links a:hover{filter:brightness(1.03)}
  footer{margin-top:56px; color:var(--muted); font-size:.9rem}
  footer a{color:var(--muted); text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">#</div>
  <h1>Arkhe</h1>
  <p class="tag">A fast, native IRCv3 client for iPhone &amp; iPad — with SASL, CertFP and full IRC bouncer support.</p>
  <div class="links">
    <a class="primary" href="/support">Support</a>
    <a href="/privacy">Privacy</a>
  </div>
  <footer>© 2026 Carlos Prieto</footer>
</div>
</body>
</html>
